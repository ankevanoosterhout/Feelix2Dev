


<div class="fixed-toolbar" id="fixed-toolbar">

  <div class="right" id="toolbar-content">
    <div>
      <ul class="buttons-list">
        <li class="padding" id="import" (click)="loadDataFromFile()"><img src="./assets/icons/buttons/import.svg" title="Import output data from file"/></li>
        <li class="padding" id="export" (click)="tensorflowService.saveDataNN('deploy')"><img src="./assets/icons/buttons/export.svg" title="Export output data to file"/></li>
        <li id="save" (click)="tensorflowService.saveMLoutput()"><img src="./assets/icons/buttons/save.svg" title="Save output data"/></li>
        <li class="padding" id="delete" (click)="tensorflowService.deleteDataSets(undefined, true)"><img src="./assets/icons/buttons/bin.svg" title="Delete output files"></li>
      </ul>

      <div id="record-button" class="record-button" [ngClass]="{ red: tensorflowRecordService.recordingActive() }" (click)="tensorflowRecordService.record('deploy')">
        <div class="circle"></div>
        <div class="rec-text">rec</div>
      </div>
    </div>
  </div>
</div>

<div class="columns">

  <div class="flexbox">

    <div class="data_content">

      <div class="form-group absolute" id="graph-header" *ngIf="d.selectedMLDataset">
        <!-- <label class="label">Dataset</label> -->
        <div class="row">
          <span *ngIf="d.selectedMLDataset">
            <input type="text" id="dataSetName" [(ngModel)]="d.selectedMLDataset.name" name="dataSetName">
          </span>

          <p class="date" *ngIf="d.selectedMLDataset && d.selectedMLDataset.date.created">{{ d.selectedMLDataset.date.created | date:'dd-MM-yyyy hh:mm' }}</p>

          <div class="data-size" *ngIf="d.selectedMLDataset && d.selectedMLDataset.m && d.selectedMLDataset.m.length > 0">size: {{ d.size }}</div>
        </div>

      </div>

      <app-graph [id]="graphID" [size]="tensorflowRecordService.size"></app-graph>

      <div class="sidebar-graph">
        <app-sidebar [page]="'deploy'" [inputDataVisible]="false" [outputDataVisible]="true"></app-sidebar>
      </div>

    </div>
  </div>

</div>
